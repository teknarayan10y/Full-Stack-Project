<svg width="400" height="300" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <!-- Header -->
  <rect x="10" y="10" width="380" height="40" fill="#f8f9fa" stroke="#e9ecef" stroke-width="2" />
  <text x="40" y="35" font-family="Arial" font-size="16" font-weight="bold" text-anchor="start" fill="#2962FF">Company</text>
  
  <!-- Navigation -->
  <text x="320" y="35" font-family="Arial" font-size="14" text-anchor="middle" fill="#666">Home</text>
  <text x="360" y="35" font-family="Arial" font-size="14" text-anchor="middle" fill="#666">About</text>
  
  <!-- Hero Section -->
  <rect x="10" y="60" width="380" height="120" fill="#2962FF" stroke="#2451cc" stroke-width="2" />
  <text x="200" y="100" font-family="Arial" font-size="24" font-weight="bold" text-anchor="middle" fill="white">Welcome to Our Platform</text>
  <text x="200" y="130" font-family="Arial" font-size="14" text-anchor="middle" fill="white">The best solution for your business needs</text>
  
  <!-- CTA Button -->
  <rect x="150" y="150" width="100" height="30" fill="#F50057" stroke="#d10048" stroke-width="1" rx="5" ry="5" />
  <text x="200" y="170" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="white">Get Started</text>
  
  <!-- Features Section -->
  <rect x="10" y="190" width="120" height="100" fill="white" stroke="#e9ecef" stroke-width="2" />
  <circle cx="70" cy="215" r="15" fill="#f8f9fa" />
  <text x="70" y="220" font-family="Arial" font-size="16" text-anchor="middle" fill="#2962FF">✓</text>
  <text x="70" y="250" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">Feature 1</text>
  <text x="70" y="270" font-family="Arial" font-size="12" text-anchor="middle" fill="#666">Description</text>
  
  <rect x="140" y="190" width="120" height="100" fill="white" stroke="#e9ecef" stroke-width="2" />
  <circle cx="200" cy="215" r="15" fill="#f8f9fa" />
  <text x="200" y="220" font-family="Arial" font-size="16" text-anchor="middle" fill="#2962FF">✓</text>
  <text x="200" y="250" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">Feature 2</text>
  <text x="200" y="270" font-family="Arial" font-size="12" text-anchor="middle" fill="#666">Description</text>
  
  <rect x="270" y="190" width="120" height="100" fill="white" stroke="#e9ecef" stroke-width="2" />
  <circle cx="330" cy="215" r="15" fill="#f8f9fa" />
  <text x="330" y="220" font-family="Arial" font-size="16" text-anchor="middle" fill="#2962FF">✓</text>
  <text x="330" y="250" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">Feature 3</text>
  <text x="330" y="270" font-family="Arial" font-size="12" text-anchor="middle" fill="#666">Description</text>
</svg>
